##############################################################################
# HeyCloud - Docker Compose
# Purpose: Local development orchestration for event producer + frontend
##############################################################################

services:
  # =========================================================================
  # Event Producer - Generates simulated e-commerce events
  # =========================================================================
  event-producer:
    build:
      context: ./services/event-producer
      dockerfile: Dockerfile
    container_name: heycloud-producer
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    restart: on-failure:3
    networks:
      - heycloud-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # =========================================================================
  # Dashboard - static HTML/JS dashboard served by nginx
  # =========================================================================
  dashboard:
    image: nginx:1.27-alpine
    container_name: heycloud-dashboard
    ports:
      - "3000:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
    networks:
      - heycloud-network

networks:
  heycloud-network:
    driver: bridge
    name: heycloud-network
