# =============================================================================
# HeyCloud Services Deployment
# Runs on: push to release/* touching services/ or api/, or manual dispatch
# Reads bucket / function / ECR names from Terraform state, so the only
# required secret is AWS_ROLE_ARN. Run "Deploy Infrastructure" first.
# =============================================================================

name: Deploy Services

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [dev, prod]
        default: dev
  push:
    branches: [release/*]
    paths:
      - "services/**"
      - "api/**"

env:
  TERRAFORM_VERSION: "1.5.7"
  PYTHON_VERSION: "3.12"
  AWS_REGION: us-east-1
  TF_ENV: ${{ inputs.environment || 'dev' }}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Lambdas & Producer Image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Read deployment targets from Terraform state
        working-directory: infrastructure/terraform
        run: |
          terraform init -input=false
          {
            echo "BUCKET=$(terraform output -raw s3_lambda_artifacts_bucket)"
            echo "SP_FUNCTION=$(terraform output -raw stream_processor_function_name)"
            echo "AA_FUNCTION=$(terraform output -raw analytics_api_function_name)"
            echo "ECR_REPO=$(terraform output -raw producer_ecr_repository_url)"
          } >> "$GITHUB_ENV"

      - name: Package and upload Lambda artifacts
        run: python scripts/package-lambdas.py --upload "$BUCKET"

      - name: Update Lambda functions
        run: |
          aws lambda update-function-code --function-name "$SP_FUNCTION" \
            --s3-bucket "$BUCKET" --s3-key stream-processor/stream-processor.zip --no-cli-pager
          aws lambda update-function-code --function-name "$AA_FUNCTION" \
            --s3-bucket "$BUCKET" --s3-key analytics-api/analytics-api.zip --no-cli-pager
          aws lambda wait function-updated --function-name "$SP_FUNCTION"
          aws lambda wait function-updated --function-name "$AA_FUNCTION"

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push producer image
        run: |
          TAG="${GITHUB_SHA:0:7}"
          docker build -t "$ECR_REPO:$TAG" -t "$ECR_REPO:latest" ./services/event-producer
          docker push --all-tags "$ECR_REPO"
